# Project Reclaimer dedicated server: Halo 3 campaign co-op, Tsavo Highway on Legendary
# with Grunt Birthday Party + Cowbell + Tough Luck, up to 16 players.
# Key reference: https://projectreclaimer.dev/host.html
# Validate with:  .\project-reclaimer.exe dedicated check

game = "game"          # Halo 3 files copied by `dedicated init --from`
content = "content"    # maps, game types, mods
data = "data"
bans = "bans.json"

host_name = "Good times saturday - Tsavo Highway"

# Leave empty to auto-detect. Use your LAN IP (e.g. "192.168.1.50") to list
# the server only on your home network while testing.
public_address = ""

# true = ask your router to open the ports itself. Otherwise forward them by hand.
upnp = false

auto_update = false    # updates restart the server mid-game
auto_reload = true     # edits to this file / the playlist apply without kicking players

# Your player ID(s), so you get admin powers on your own server: /kick, /ban, and you can't be vote-kicked.
# Find it in the game: Settings -> Online services -> Player ID.
admins = []

# Remote console (TCP, same number as the game port), used by name-guard.ps1.
# setup-windows.ps1 adds an [rcon] section with a random password to the server's copy of
# this file. Don't put a password here: this repo is public.

[defaults]
max_players = 16           # co-op campaign holds at most 16; more stops the server
min_players = 1            # the mission starts as soon as one player is in
camera = "first_person"
voice = true
voice_proximity = true
text_chat = true
votes = true               # vote kick (Tab -> Vote Kick, or /vote kick <name>), plus vote end round/game.
                           # Passes with >50% yes in 30 s. Kicked = out 10 min, then 30/60/120 min for repeat kicks that day.
                           # There's no vote ban: bans are for admins (add your player ID to `admins`, then /ban <name>).
anti_cheat = "enforce"
block_vpn = true
max_ping = 0               # 0 = no limit
load_timeout = 30
share_mods = false
welcome = "Tsavo Highway on Legendary. Skulls: Grunt Birthday Party, Cowbell, Tough Luck. Up to 16 players."
password = ""              # set one to keep it private

[[server]]
name = "Good times saturday - Tsavo Highway"
port = 49176               # UDP
# mission 3030 = Tsavo Highway (3010 Sierra 117, 3020 Crow's Nest, 3040 The Storm, 3050 Floodgate,
#   3070 The Ark, 3100 The Covenant, 3110 Cortana, 3120 Halo). After it, the server goes on
#   through the campaign, then starts over from Tsavo.
# insertion 0 = the mission's start; 1+ = its later rally points.
# custom_characters = everyone plays their own Spartan/Elite instead of Chief and the Arbiter.
# skulls = sum of the ones on: Grunt Birthday Party 4096 + Cowbell 2048 + Tough Luck 4 = 6148.
#   Iron 1, Black Eye 2, Tough Luck 4, Catch 8, Fog 16, Famine 32, Thunderstorm 64, Tilt 128,
#   Mythic 256, Assassin 512, Blind 1024, Cowbell 2048, Grunt Birthday Party 4096, IWHBYD 8192.
#   Don't add Iron with many players: anyone dying sends everyone back to the checkpoint.
campaign = { mission = 3030, insertion = 0, difficulty = "legendary", custom_characters = true, modifiers = { skulls = 6148 } }
